<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
  <title>Efraín Salas - Redes</title>
  <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

  <!-- Meta Description - Write a description (150-160 characters recommended) -->
  <meta name="description" content="Replace this with your own, this appears in search results and when sharing.">

  <!-- Keywords -->
  <meta name="keywords" content="your name, industry, and specialties">

  <!-- Canonical URL - Helps prevent duplicate content issues -->
  <meta rel="canonical" href="https://yourwebsite.com">

  <!-- Author Information -->
  <meta name="author" content="Efraín Salas">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brands.css">

  <!-- LittleLink Extended Stylesheet (Optional) -->
  <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
  <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

</head>

<body>

  <div class="container">
    <div class="column">

      <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
      <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink">

      <!-- Replace with your name or brand -->
      <h1>
        <div>WoltyMx</div>
      </h1>

      <!-- Add a short description about yourself or your brand -->
      <p>An open source DIY Linktree alternative.</p>

      <!-- All your buttons go here -->
      <div class="button-stack" role="navigation">


        <!-- Buy Me A Coffee -->
        <a class="button button-coffee" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/buy-me-a-coffee.svg" alt="Buy Me A Coffee Logo">Comprame un cafe</a>

        <!-- Amazon -->
        <a class="button button-amazon" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/amazon.svg" alt="Amazon Wishlist Logo">Amazon Wishlist</a>

        <!-- Cal.com -->
        <a class="button button-cal" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/cal.svg" alt="Cal.com Logo">Schedule with Cal.com</a>

        <!-- Cash App -->
        <a class="button button-cash-app" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/cash-app-dollar.svg" alt="Cash App Logo">Cash App</a>

        <!-- Discogs -->
        <a class="button button-discogs" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/discogs.svg" alt="Discogs Logo">Discogs</a>

        <!-- Discord -->
        <a class="button button-discord" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/discord.svg" alt="Discord Logo">Discord</a>

        <!-- Facebook -->
        <a class="button button-faceb" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/facebook.svg" alt="Facebook Logo">Find us on Facebook</a>

        <!-- Instagram -->
        <a class="button button-instagram" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

        <!-- Patreon -->
        <a class="button button-patreon" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/patreon.svg" alt="Patreon Logo">Patreon</a>

        <!-- PayPal -->
        <a class="button button-paypal" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/paypal.svg" alt="PayPal Logo">PayPal</a>

        <!-- TikTok -->
        <a class="button button-tiktok" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a>

        <!-- YouTube -->
        <a class="button button-yt" href="#" target="_blank" rel="noopener" role="button"><img class="icon"
            aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">YouTube</a>

      </div>

    </div>
  </div>

</body>

</html>
